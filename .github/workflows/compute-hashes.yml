name: Compute Hashes

on:
  workflow_dispatch:

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print SHA-256 hashes
        run: |
          EXCLUDE="DUAL-LICENSING.md|Zero-Cloud-Smart-Home-Edge-AI-Architecture.md|Zero-Cloud-Defensive-Publication.md|FC-ZC-Conformance-Test-Specification.md|ZERO-CLOUD-RELEASE-MANIFEST.md|ZC-CORE-METHODOLOGY-INVARIANTS.md|SECURITY.md|CONTRIBUTING.md|CITATION.cff"
          for f in *.md; do
            if echo "$f" | grep -qE "$EXCLUDE"; then continue; fi
            echo "$(sha256sum "$f" | awk '{print toupper($1)}')  $f"
          done
