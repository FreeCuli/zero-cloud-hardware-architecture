name: Release Verification

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify all canonical documents exist
        run: |
          echo "Checking canonical documents exist..."
          MISSING=0
          for f in \
            "README.md" \
            "ZERO-CLOUD-RELEASE-MANIFEST.md" \
            "ZC-CORE-CONFORMANCE-EVIDENCE-PACKAGE.md" \
            "zero-cloud-core-attack-taxonomy.md" \
            "zero-cloud-core-brand-and-trademark-policy.md" \
            "zero-cloud-core-conformance-evidence-matrix.md" \
            "zero-cloud-core-conformance-test-specification.md" \
            "zero-cloud-core-defensive-publication.md" \
            "zero-cloud-core-implementation-coverage.md" \
            "zero-cloud-core-methodology-invariants.md" \
            "zero-cloud-core-scope-boundary.md" \
            "zero-cloud-core-versioning-and-governance.md" \
            "zero-cloud-dual-licensing.md" \
            "zero-cloud-hardware-reference-architecture.md"; do
            if [ ! -f "$f" ]; then
              echo "[FAIL] Missing: $f"
              MISSING=1
            else
              echo "[PASS] Found: $f"
            fi
          done
          if [ "$MISSING" -ne 0 ]; then exit 1; fi

      - name: Verify SHA-256 hashes against manifest (Bidirectional)
        run: |
          echo "Verifying SHA-256 hashes bidirectionally..."
          EXCLUDE="DUAL-LICENSING.md|Zero-Cloud-Smart-Home-Edge-AI-Architecture.md|Zero-Cloud-Defensive-Publication.md|FC-ZC-Conformance-Test-Specification.md|ZERO-CLOUD-RELEASE-MANIFEST.md|ZC-CORE-METHODOLOGY-INVARIANTS.md|SECURITY.md|CONTRIBUTING.md|CITATION.cff|RELEASE-MANIFEST-v3.3.0-rc2.md"
          MANIFEST=$(cat ZERO-CLOUD-RELEASE-MANIFEST.md)
          
          # 1. File -> Manifest check (exact HASH + FILENAME line matching)
          for f in *.md; do
            if echo "$f" | grep -qE "$EXCLUDE"; then
              continue
            fi
            ACTUAL=$(sha256sum "$f" | awk '{print toupper($1)}')
            if echo "$MANIFEST" | grep -qiE "^${ACTUAL}\s+${f}$"; then
              echo "[PASS] $f -> $ACTUAL matches exact manifest entry"
            else
              echo "[FAIL] $f -> hash mismatch or missing exact entry in manifest. Actual: $ACTUAL"
              exit 1
            fi
          done

          # 2. Manifest -> File check (every listed file must exist and match)
          while read -r EXPECTED_HASH FILE_NAME; do
            if [ -n "$FILE_NAME" ]; then
              if [ ! -f "$FILE_NAME" ]; then
                echo "[FAIL] Manifest references non-existent file: $FILE_NAME"
                exit 1
              fi
              CURRENT_HASH=$(sha256sum "$FILE_NAME" | awk '{print toupper($1)}')
              if [ "$CURRENT_HASH" != "$EXPECTED_HASH" ]; then
                echo "[FAIL] $FILE_NAME hash in manifest ($EXPECTED_HASH) != disk ($CURRENT_HASH)"
                exit 1
              fi
              echo "[PASS] Verified manifest entry: $FILE_NAME"
            fi
          done < <(grep -E "^[A-F0-9]{64}  " ZERO-CLOUD-RELEASE-MANIFEST.md)

          echo "Bidirectional SHA-256 hash verification passed."

      - name: Verify Git tag provenance resolution
        run: |
          echo "Verifying Git provenance and tag resolution..."
          RELEASE_TAG=$(grep -oE "Git Tag: (v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?)" ZERO-CLOUD-RELEASE-MANIFEST.md | head -n 1 | awk '{print $3}')
          if [ -z "$RELEASE_TAG" ]; then
            echo "[FAIL] Release Tag declaration missing in ZERO-CLOUD-RELEASE-MANIFEST.md."
            exit 1
          fi
          echo "[PASS] Release Tag ($RELEASE_TAG) declared in manifest."

          if ! grep -q "Git Commit Resolution" ZERO-CLOUD-RELEASE-MANIFEST.md; then
            echo "[FAIL] Git Commit Resolution declaration missing in manifest."
            exit 1
          fi
          echo "[PASS] Git Commit Resolution declared in manifest."

          # Determine whether this is a formal Git tag release run
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "Formal release tag trigger detected: ${GITHUB_REF_NAME}"
            if [ -z "${GITHUB_REF_NAME}" ] || [ "${GITHUB_REF_NAME}" != "$RELEASE_TAG" ]; then
              echo "[FAIL] Git tag and manifest RELEASE_TAG mismatch."
              exit 1
            fi
            echo "[PASS] Git tag matches release manifest ($RELEASE_TAG)."
          else
            echo "[INFO] Running on non-tag event (${GITHUB_REF_TYPE:-commit}: ${GITHUB_REF_NAME:-detached}); validating against manifest tag target ($RELEASE_TAG)."
          fi

          # Deep git tag provenance check: ensure the tag points to the current checkout commit
          git fetch --tags --force
          TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)
          HEAD_COMMIT=$(git rev-parse HEAD)
          echo "Tag resolved commit:  $TAG_COMMIT"
          echo "Current HEAD commit: $HEAD_COMMIT"
          if [ -n "$TAG_COMMIT" ]; then
            if [ "$TAG_COMMIT" = "$HEAD_COMMIT" ]; then
              echo "[PASS] refs/tags/$RELEASE_TAG strictly resolves to current release HEAD commit ($HEAD_COMMIT)."
            else
              echo "[FAIL] Provenance mismatch: refs/tags/$RELEASE_TAG resolves to ($TAG_COMMIT) but HEAD is ($HEAD_COMMIT)."
              exit 1
            fi
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "[FAIL] Required release tag $RELEASE_TAG could not be resolved on release tag event."
            exit 1
          else
            echo "[INFO] Release tag $RELEASE_TAG not yet tagged on remote (pre-tag commit verification)."
          fi

      - name: Verify Git tag signature
        run: |
          RELEASE_TAG=$(grep -oE "Git Tag: (v[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?)" ZERO-CLOUD-RELEASE-MANIFEST.md | head -n 1 | awk '{print $3}')
          echo "Verifying signature for release tag $RELEASE_TAG..."
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile .github/allowed_signers

          if git rev-parse "$RELEASE_TAG" >/dev/null 2>&1; then
            if git tag -v "$RELEASE_TAG"; then
              echo "[PASS] Git Tag $RELEASE_TAG signature is VALID and belongs to a trusted signer."
            else
              echo "[FAIL] Git Tag $RELEASE_TAG signature verification failed!"
              exit 1
            fi
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "[FAIL] Git Tag $RELEASE_TAG missing on tag push event!"
            exit 1
          else
            echo "[INFO] Git Tag $RELEASE_TAG not present in local tree; signature check is deferred to formal release tagging."
          fi

      - name: Verify no legacy normative content
        run: |
          FAIL=0
          for f in "DUAL-LICENSING.md" "FC-ZC-Conformance-Test-Specification.md" "ZC-CORE-METHODOLOGY-INVARIANTS.md" "Zero-Cloud-Defensive-Publication.md" "Zero-Cloud-Smart-Home-Edge-AI-Architecture.md"; do
            if [ -f "$f" ]; then
              if grep -qi "OBSOLETED\|SUPERSEDED" "$f"; then
                echo "[PASS] $f correctly marked as superseded."
              else
                echo "[FAIL] $f exists but not marked as superseded."
                FAIL=1
              fi
            fi
          done
          if [ "$FAIL" -ne 0 ]; then exit 1; fi