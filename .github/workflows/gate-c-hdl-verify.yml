name: Gate C HDL Verification

on:
  push:
    branches:
      - 'gate-c/**'
  pull_request:
    branches:
      - 'main'
      - 'gate-c/**'
  workflow_dispatch:

jobs:
  gate-c-hdl-verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Open-Source HDL & Formal Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator iverilog yosys z3 python3
          echo "=== Installed Tool Versions ==="
          verilator --version
          iverilog -V | head -n 3
          yosys -V
          z3 --version

      - name: Step 1 - Verilator RTL Lint & Elaboration (-Wall)
        run: |
          echo "=== [1/3] Verilator Lint: zc_otp_pkg.sv + zc_aon_post_auth_ctrl.sv ==="
          verilator --lint-only -Wall --top-module zc_aon_post_auth_ctrl rtl/zc_otp_pkg.sv rtl/zc_aon_post_auth_ctrl.sv
          echo "[PASS] zc_aon_post_auth_ctrl lint clean (exit 0)"

          echo "=== [2/3] Verilator Lint: zc_spi_flash_firewall.sv ==="
          verilator --lint-only -Wall --top-module zc_spi_flash_firewall rtl/zc_spi_flash_firewall.sv
          echo "[PASS] zc_spi_flash_firewall lint clean (exit 0)"

          echo "=== [3/3] Verilator Lint: zc_obi_subordinate_bridge.sv ==="
          verilator --lint-only -Wall --top-module zc_obi_subordinate_bridge rtl/zc_obi_subordinate_bridge.sv
          echo "[PASS] zc_obi_subordinate_bridge lint clean (exit 0)"

      - name: Step 2 - HDL Cycle-Accurate Simulation & Dual-Compiled Equivalence
        run: |
          echo "=== [SIM-1] OTP 4-Phase FSM, Recovery, & Exhaustive 4,080 (k,v) Seal Simulation (tb_zc_otp) ==="
          verilator --binary -j 0 -Wno-fatal --top-module tb_zc_otp rtl/zc_otp_pkg.sv rtl/zc_aon_post_auth_ctrl.sv tb/tb_zc_otp.sv -o sim_otp
          ./obj_dir/sim_otp

          echo "=== [SIM-2] SPI 3-Layer Event Separation & Update Reconciler Simulation (tb_zc_spi) ==="
          verilator --binary -j 0 -Wno-fatal --top-module tb_zc_spi rtl/zc_spi_flash_firewall.sv tb/tb_zc_spi.sv -o sim_spi
          ./obj_dir/sim_spi

          echo "=== [SIM-3] OBI Warm Reset (GCR-01), 1024-Cycle Watchdog, & ST_TRAP Simulation (tb_zc_obi) ==="
          verilator --binary -j 0 -Wno-fatal --top-module tb_zc_obi rtl/zc_obi_subordinate_bridge.sv tb/tb_zc_obi.sv -o sim_obi
          ./obj_dir/sim_obi

          echo "=== [SIM-4a] P-5 OTP 12,240-Word Equivalence (Verilator Standard Package Build) ==="
          verilator --binary -j 0 -Wno-fatal --top-module tb_zc_otp_fn_equiv rtl/zc_otp_pkg.sv rtl/zc_aon_post_auth_ctrl.sv tb/tb_zc_otp_fn_equiv.sv -o sim_otp_equiv_pkg
          ./obj_dir/sim_otp_equiv_pkg

          echo "=== [SIM-4b] P-5 OTP 12,240-Word Equivalence (Verilator -DYOSYS Shift-Add Build) ==="
          verilator --binary -j 0 -Wno-fatal -DYOSYS --top-module tb_zc_otp_fn_equiv rtl/zc_otp_pkg.sv rtl/zc_aon_post_auth_ctrl.sv tb/tb_zc_otp_fn_equiv.sv -o sim_otp_equiv_yosys
          ./obj_dir/sim_otp_equiv_yosys

          echo "=== [SIM-5] Cross-Simulator Verification with Icarus Verilog (iverilog -g2012) ==="
          iverilog -g2012 -o sim_spi_iv rtl/zc_spi_flash_firewall.sv tb/tb_zc_spi.sv && vvp sim_spi_iv
          iverilog -g2012 -o sim_obi_iv rtl/zc_obi_subordinate_bridge.sv tb/tb_zc_obi.sv && vvp sim_obi_iv
          iverilog -g2012 -o sim_otp_equiv_iv rtl/zc_otp_pkg.sv rtl/zc_aon_post_auth_ctrl.sv tb/tb_zc_otp_fn_equiv.sv && vvp sim_otp_equiv_iv
          iverilog -g2012 -DYOSYS -o sim_otp_equiv_yosys_iv rtl/zc_otp_pkg.sv rtl/zc_aon_post_auth_ctrl.sv tb/tb_zc_otp_fn_equiv.sv && vvp sim_otp_equiv_yosys_iv

      - name: Step 3a - SPI Formal Proof (BMC & k-Induction)
        run: |
          echo "### Formal Proof: SPI 3-Layer Firewall" >> $GITHUB_STEP_SUMMARY
          yosys -p "read_verilog -sv -formal rtl/zc_spi_flash_firewall.sv fv/zc_spi_formal_proof.sv; prep -top zc_spi_formal_proof -flatten; async2sync; opt; dffunmap; write_smt2 spi_formal.smt2" > yosys_spi.log 2>&1
          echo "#### SPI BMC (depth 20)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          yosys-smtbmc --unroll -s z3 -t 20 spi_formal.smt2 2>&1 | tee spi_bmc.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "#### SPI k-Induction (depth 20)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          yosys-smtbmc --unroll -s z3 -i -t 20 spi_formal.smt2 2>&1 | tee spi_ind.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Step 3b - OBI Formal Proof (BMC & k-Induction)
        run: |
          echo "### Formal Proof: OBI Subordinate Bridge" >> $GITHUB_STEP_SUMMARY
          yosys -p "read_verilog -sv -formal rtl/zc_obi_subordinate_bridge.sv fv/zc_obi_formal_proof.sv; prep -top zc_obi_formal_proof -flatten; async2sync; opt; dffunmap; write_smt2 obi_formal.smt2" > yosys_obi.log 2>&1
          echo "#### OBI BMC (depth 20)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          yosys-smtbmc --unroll -s z3 -t 20 obi_formal.smt2 2>&1 | tee obi_bmc.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "#### OBI k-Induction (depth 20)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          yosys-smtbmc --unroll -s z3 -i -t 20 obi_formal.smt2 2>&1 | tee obi_ind.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Step 3c - OTP Formal Proof (BMC & k-Induction)
        run: |
          echo "### Formal Proof: OTP Authorization FSM" >> $GITHUB_STEP_SUMMARY
          yosys -p "read_verilog -sv -formal rtl/zc_aon_post_auth_ctrl.sv fv/zc_otp_formal_proof.sv; prep -top zc_otp_formal_proof -flatten; async2sync; opt; dffunmap; write_smt2 otp_formal.smt2" > yosys_otp.log 2>&1
          echo "#### OTP BMC (depth 20)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          yosys-smtbmc --unroll -s z3 -t 20 otp_formal.smt2 2>&1 | tee otp_bmc.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "#### OTP k-Induction (depth 20)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          yosys-smtbmc --unroll -s z3 -i -t 20 otp_formal.smt2 2>&1 | tee otp_ind.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Step 4 - Formal Non-Vacuity Cover Witness Checking (yosys-smtbmc -c)
        run: |
          echo "### Non-Vacuity Cover Analysis" >> $GITHUB_STEP_SUMMARY
          echo "#### SPI Covers" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          yosys-smtbmc --unroll -s z3 -c -t 20 spi_formal.smt2 2>&1 | tee spi_cov.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "#### OBI Covers" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          yosys-smtbmc --unroll -s z3 -c -t 20 obi_formal.smt2 2>&1 | tee obi_cov.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "#### OTP Covers" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          yosys-smtbmc --unroll -s z3 -c -t 20 otp_formal.smt2 2>&1 | tee otp_cov.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Step 5 - SVA Tool Capability Notice (Normative Commercial SVA and M7/M8 Status)
        run: |
          echo "=== Checking Concurrent SVA Sequence Syntax (throughout / [->1] / ##[1:49152]) ==="
          echo "[INFO] Preserving full concurrent SVA files unmodified: fv/zc_otp_sva.sv, fv/zc_spi_sva.sv, fv/zc_obi_sva.sv, fv/zc_m7_m8_ni_sva.sv"
          echo "[BLOCKED] Concurrent SVA sequence operators (throughout, [->1], ##[1:49152]) and 2-trace full-SoC M7/M8 miter require commercial SVA formal tools (JasperGold / VC Formal) and top-level NPU/SRAM RTL."
          echo "[SEE] evidence/gate-c/MODELING_LIMITS.md for detailed modeling boundaries."

      - name: Step 6 - Auxiliary PowerShell Mathematical & Structural Check (19/19)
        shell: pwsh
        run: |
          ./scripts/verify_gate_b_rev28d.ps1

      - name: Step 7 - Formal Audit Verdict Verification
        run: |
          echo "=== Evaluating Formal Verification Results ==="
          FAILED=0
          for log in spi_bmc.log spi_ind.log obi_bmc.log obi_ind.log otp_bmc.log otp_ind.log spi_cov.log obi_cov.log otp_cov.log; do
            if [ -f "$log" ]; then
              if grep -q "Assert failed" "$log"; then
                echo "[ERROR] Assertion failed in $log:"
                grep -n "Assert failed" "$log"
                FAILED=1
              fi
              if grep -q "Unreached cover" "$log"; then
                echo "[ERROR] Cover target unreached in $log:"
                grep -n "Unreached cover" "$log"
                FAILED=1
              fi
              if grep -q "syntax error" "$log"; then
                echo "[ERROR] Syntax error in $log:"
                grep -n "syntax error" "$log"
                FAILED=1
              fi
            else
              echo "[ERROR] Expected log file $log was not created!"
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "[VERDICT] Formal verification failed. See logs above."
            exit 1
          else
            echo "[VERDICT] All formal assertions and non-vacuity covers PASSED successfully!"
          fi

      - name: Step 8 - Upload Gate C HDL Verification Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-c-formal-evidence
          path: |
            *.smt2
            *.log
            evidence/gate-c/MODELING_LIMITS.md
          retention-days: 90
